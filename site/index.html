:root {
  --night: #150b2b;
  --night-2: #21104a;
  --plum: #3b1a5e;
  --bone: #f3e9d2;
  --bone-dim: #c9bddb;
  --marigold: #ff9a1f;
  --magenta: #e0307a;
  --ink: #1a0f2e;
  --spirit: #ffc233;
  --display: "Pirata One", Georgia, serif;
  --voice: "IM Fell English", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  color: var(--bone);
  font-family: var(--voice);
  line-height: 1.5;
  background: radial-gradient(120% 60% at 50% -8%, #3a1c7a 0%, var(--night-2) 38%, var(--night) 76%) fixed var(--night);
  overflow-x: hidden;
}
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 40px) 56px; }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

#banner { position: relative; z-index: 2; height: 82px; overflow: hidden; display: flex; justify-content: center; gap: 6px; padding-top: 6px; }
#banner::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: rgba(243, 233, 210, .38); }
.flag { flex: none; transform-origin: 50% 0; animation: sway 4.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.35s); }
.flag svg { display: block; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 2rem; padding: 1.1rem 0 .4rem; }
h1 { margin: 0; font: 400 clamp(3.4rem, 9vw, 5.8rem) / .88 var(--display); text-shadow: 0 0 34px rgba(255, 154, 31, .45); }

<script type="module">// Four original cartoon ghosts, drawn as inline SVG so they can be animated with CSS.

const INK = '#1a0f2e';
const BODY =

const TINT = { cobol: '#ffe9a8', fortran: '#c4f4fb', lisp: '#efd2ff', perl: '#c8f8d5' };
const MONO = "'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace";

let uid = 0;

// A punch card: 3 rows of rectangular holes in a deterministic pattern.
function punchHoles() {
  let out = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 9; c++) {
      if ((r * 5 + c * 3 + r * c) % 4 < 2) {
        out += `<rect x="${9 + c * 7.6}" y="${9 + r * 12}" width="4" height="7" fill="${INK}"/>`;
      }

  }
  return out;
}

const ART = {

    front:
      `<g fill="rgba(190,240,250,.28)" stroke="${INK}" stroke-width="4" stroke-linecap="round">` +

      `<g transform="translate(118 184) rotate(-9)"><path d="M10 0 H86 V50 H0 V10 Z" fill="#f1e4c4" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/>` +

  // LISP: a wizard hat with a lambda, and parentheses orbiting it.
  lisp: (n, hex) => ({
    back:

      `<text class="paren l" x="-34" y="206">(</text><text class="paren r" x="196" y="206">)</text></g>`,

      `<text x="121" y="24" text-anchor="middle" font-family="${MONO}" font-weight="500" font-size="30" fill="#ffd36a">λ</text>` +
      `<circle cx="100" cy="2" r="3" fill="#ffd36a"/><circle cx="146" cy="14" r="2.5" fill="#ffd36a"/>`,

// A small sleeping ghost with a marigold crown: the "photograph" on an ofrenda frame.
function ghostPortrait(seed, label) {
  const tint = PORTRAIT_TINTS[Math.abs(seed) % PORTRAIT_TINTS.length];
  const flower = (x, y, r) =>
    `<circle cx="${x}" cy="${y}" r="${r}" fill="#ff9a1f" stroke="${INK}" stroke-width="2.5"/>` +

    `<path d="M76 118 q16 14 32 0 M132 118 q16 14 32 0" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>` +
    `<path d="M108 158 q12 9 24 0" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>` +

// Scenery: papel picado banner, the ofrenda altar (marigolds and candles), drifting petals.

const FLAG_COLORS = ['#e0307a', '#ff9a1f', '#19b5a5', '#8a4fff', '#f6d33b'];

const circle = (cx, cy, r) => `M${cx - r} ${cy} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0 Z`;
const diamond = (cx, cy, r) => `M${cx} ${cy - r} L${cx + r} ${cy} L${cx} ${cy + r} L${cx - r} ${cy} Z`;

// Cut-out patterns; with fill-rule evenodd the holes show the night sky through the paper.
const CUTS = [
  () => circle(40, 26, 11) + diamond(17, 42, 6) + diamond(63, 42, 6) + circle(40, 48, 4),
  () => diamond(40, 16, 7) + diamond(40, 34, 7) + diamond(40, 52, 7) + circle(16, 30, 4) + circle(64, 30, 4),

const FLAG_EDGE = 'M0 0 H80 V62 L70 72 L60 62 L50 72 L40 62 L30 72 L20 62 L10 72 L0 62 Z';

function buildBanner(el) {
  for (let i = 0; i < 26; i++) {

      `<path fill="${FLAG_COLORS[i % FLAG_COLORS.length]}" fill-rule="evenodd" d="${FLAG_EDGE} ${CUTS[i % CUTS.length]()}"/></svg>`;

// A marigold: ring of overlapping petals around a dark centre.
function marigold(cx, cy, r) {
  let petals = '';
  for (let i = 0; i < 14; i++) {
    petals += `<ellipse cx="0" cy="${-r * 0.52}" rx="${r * 0.3}" ry="${r * 0.5}" transform="rotate(${i * (360 / 14)})" fill="${i % 2 ? '#ffb83d' : '#ff9a1f'}"/>`;

  return `<g transform="translate(${cx} ${cy})">${petals}<circle r="${r * 0.3}" fill="#d96a00"/></g>`;

  );
}

  el.innerHTML =
    `<svg viewBox="0 0 600 190" preserveAspectRatio="xMidYMax meet" aria-hidden="true">` +
    `<defs>` +
    `<radialGradient id="flame" cx="50%" cy="75%" r="60%"><stop offset="0" stop-color="#fff6c8"/><stop offset=".55" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff7a1a"/></radialGradient>` +
    `<radialGradient id="glow"><stop offset="0" style="stop-color:var(--spirit);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--spirit);stop-opacity:0"/></radialGradient>` +
    `</defs>` +
    tiers.map((t) => `<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" rx="5" fill="${t.fill}" stroke="#ff9a1f" stroke-width="2"/>`).join('') +
    flowers + candles + `</svg>`;
}

// Marigold petals rising slowly, like something being carried upward. Skipped when motion is reduced.
function startPetals(canvas) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = canvas.getContext('2d');
  const COLORS = ['#ff9a1f', '#ffb83d', '#f6d33b'];
  let w = 0, h = 0, raf = 0;
  const petals = Array.from({ length: 34 }, () => ({
    x: Math.random(), y: Math.random(), s: 0.6 + Math.random() * 0.9, vy: 0.00006 + Math.random() * 0.00018,
    sway: Math.random() * Math.PI * 2, rot: Math.random() * Math.PI * 2, spin: (Math.random() - 0.5) * 0.02,
    c: COLORS[(Math.random() * COLORS.length) | 0], a: 0.35 + Math.random() * 0.5,
  }));

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    for (const p of petals) {
      p.y -= p.vy * 16; p.sway += 0.012; p.rot += p.spin;
      if (p.y < -0.05) { p.y = 1.05; p.x = Math.random(); }
      ctx.save();
      ctx.translate((p.x + Math.sin(p.sway) * 0.015) * w, p.y * h);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, 4.5 * p.s, 8.5 * p.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    raf = requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if (!document.hidden) raf = requestAnimationFrame(frame);
  });
  resize();
  raf = requestAnimationFrame(frame);
}



// Everything in the data block comes from git (commit messages, folder names) and from a model,
// so none of it is ever parsed as HTML: it only goes in through textContent.
const data = JSON.parse(document.getElementById('data').textContent);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};
const fmtDate = (iso) =>
  new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
const joinList = (items) =>
  items.length < 2 ? items.join('') : `${items.slice(0, -1).join(', ')} and ${items[items.length - 1]}`;

const CANDLE =
  '<svg viewBox="0 0 46 98" aria-hidden="true">' +
  '<g class="flame"><path d="M23 2 C11 19 14 33 23 42 C32 33 35 19 23 2Z" fill="#ff9a1f"/>' +
  '<path d="M23 17 C17 27 18 35 23 40 C28 35 29 27 23 17Z" fill="#fff1b0"/></g>' +
  '<rect x="12" y="42" width="22" height="52" rx="3" fill="#f3e9d2" stroke="#1a0f2e" stroke-width="3"/>' +
  '<path d="M23 42 v-6" stroke="#1a0f2e" stroke-width="3" stroke-linecap="round"/></svg>';

const frames = [];
const touched = new Set();
let toggleBtn = null;

function fact(cls, term, value) {
  const row = el('div', cls);
  row.append(el('dt', null, term), el('dd', null, value));
  return row;
}

function buildFrame(p) {
  const card = el('li', 'frame');
  card.dataset.lit = 'false';

  const candle = el('button', 'candle');
  candle.type = 'button';
  candle.setAttribute('aria-pressed', 'false');
  candle.setAttribute('aria-label', `Light a candle for ${p.name}`);
  candle.innerHTML = CANDLE;
  candle.addEventListener('click', () => {
    touched.add(card);
    setLit(card, card.dataset.lit !== 'true');
  });

  const portrait = el('div', 'portrait');
  portrait.innerHTML = ghostPortrait(p.seed, `A sleeping ghost for ${p.name}`);

  const facts = el('dl', 'facts');
  facts.append(fact('', 'Cause of death', p.cause));
  if (p.lastWords) facts.append(fact('last', 'Last words', `“${p.lastWords}”`));
  facts.append(fact('', 'Offering', p.offering));

  const langs = p.langs.length ? ` in ${joinList(p.langs)}` : '';
  card.append(
    candle,
    portrait,
    el('h2', null, p.name),
    el('p', 'dates', `${fmtDate(p.born)} to ${fmtDate(p.died)}`),
    el('p', 'epitaph', p.epitaph),
    facts,
    el('p', 'vitals', `${plural(p.commits, 'commit')}${langs}. Quiet for ${p.quiet}.`),
  );
  return card;
}

function setLit(card, on) {
  card.dataset.lit = String(on);
  const btn = card.querySelector('.candle');
  btn.setAttribute('aria-pressed', String(on));
  btn.setAttribute('aria-label', `${on ? 'Put out' : 'Light'} the candle for ${card.querySelector('h2').textContent}`);
  syncToggle();
}

function syncToggle() {
  if (!toggleBtn) return;
  toggleBtn.textContent = frames.every((f) => f.dataset.lit === 'true') ? 'Put out the candles' : 'Light every candle';
}

// The one orchestrated moment: candles catch one after another when the page opens.
function lightInSequence() {
  if (reduced) {
    frames.forEach((f) => setLit(f, true));
    return;
  }
  const gap = Math.min(170, 2600 / Math.max(frames.length, 1));
  frames.forEach((f, i) => setTimeout(() => { if (!touched.has(f)) setLit(f, true); }, 600 + i * gap));
}

function buildElders() {
  const sec = el('section', 'elders');
  sec.setAttribute('aria-label', 'The old languages');
  sec.append(el('h2', null, 'The old ones'));
  sec.append(el('p', 'lede', 'The four languages that haunt your terminal are remembered here too. Some of them are still working.'));
  const grid = el('div', 'elder-grid');
  for (const e of data.elders) {
    const fig = el('figure', 'elder');
    fig.style.setProperty('--spirit', e.hex);
    const art = el('div', 'art');
    art.innerHTML = spiritSVG(e.name, e.display, e.hex);
    fig.append(art, el('b', null, e.short), el('span', 'born', `born ${e.born}`), el('p', null, e.death));
    grid.append(fig);
  }
  sec.append(grid);
  return sec;
}

function buildFooter() {
  const foot = el('footer', 'foot');
  const s = data.stats || {};
  if (data.demo) {
    foot.append(el('p', null, 'These projects are fictional samples. Run ghost ofrenda on your own folders to build a real one: every epitaph is then written by a local open-weight model, and nothing leaves your machine.'));
  } else if (data.model) {
    foot.append(el('p', null, `Every remembrance was written by ${data.model}, an open-weight model, on the machine that holds these repositories. Nothing was uploaded.`));
    if (s.template) {
      foot.append(el('p', null, `${plural(s.template, 'remembrance')} came from a plain template, because the model's words failed a fact check.`));
    }
  } else {
    foot.append(el('p', null, 'These remembrances were written from a plain template. No model was used.'));
  }
  foot.append(el('p', null, `Candles lit on ${fmtDate(data.generated)}.`));
  return foot;
}

function boot() {
  buildBanner(document.getElementById('banner'));
  startPetals(document.getElementById('petals'));
  const root = document.getElementById('root');
  root.textContent = '';

  const top = el('header', 'top');
  const left = el('div');
  left.append(el('h1', null, 'Ofrenda'));
  left.append(el('p', 'lede', data.projects.length
    ? 'Projects that stopped here, remembered with a candle, an epitaph and an offering.'
    : 'Nothing to remember yet.'));
  top.append(left);
  root.append(top);

  if (!data.projects.length) {
    const empty = el('p', 'empty', 'No abandoned projects were found, so every candle is still waiting. Point the scanner at a folder with older repositories, or lower the age limit: ');
    empty.append(el('code', null, 'ghost ofrenda ~/projects --months 1'));
    root.append(empty);
  } else {
    toggleBtn = el('button', null, 'Light every candle');
    toggleBtn.id = 'toggle';
    toggleBtn.type = 'button';
    toggleBtn.addEventListener('click', () => {
      const lightAll = !frames.every((f) => f.dataset.lit === 'true');
      frames.forEach((f) => { touched.add(f); setLit(f, lightAll); });
    });
    top.append(toggleBtn);

    const list = el('ul', 'frames');
    for (const p of data.projects) {
      const card = buildFrame(p);
      frames.push(card);
      list.append(card);
    }
    root.append(list);
  }
  root.append(buildElders(), buildFooter());
  if (frames.length) lightInSequence();
}

boot();
</script>
</body>
</html>
